components:

  schemas:

    Filme:
      type: object

      required:
        - nome
        - sinopse
        - data_lancamento

      properties:

        id:
          type: integer
          example: 1

        nome:
          type: string
          example: Vingadores Ultimato

        sinopse:
          type: string
          example: Filme de ação e aventura da Marvel

        data_lancamento:
          type: string
          format: date
          example: 2019-04-25

        duracao:
          type: string
          example: 03:01:00

        capa:
          type: string
          example: https://imagem.com/capa.jpg

        valor:
          type: number
          format: float
          example: 29.90

        avaliacao:
          type: number
          format: float
          example: 8.5

    Genero:
      type: object

      required:
        - nome_genero

      properties:

        id:
          type: integer
          example: 1

        nome_genero:
          type: string
          example: Ficção Científica

    Sexo:
      type: object

      required:
        - sexo

      properties:

        id:
          type: integer
          example: 1

        sexo:
          type: string
          example: M

    Nacionalidade:
      type: object

      required:
        - nacionalidade

      properties:

        id:
          type: integer
          example: 1

        nacionalidade:
          type: string
          example: Brasileira

    Classificacao:
      type: object

      required:
        - classificacao

      properties:

        id:
          type: integer
          example: 1

        classificacao:
          type: string
          example: 16 anos

    Ator:
      type: object

      required:
        - nome
        - data_nascimento
        - foto
        - biografia
        - id_sexo

      properties:

        id:
          type: integer
          example: 1

        nome:
          type: string
          example: Tom Holland

        data_nascimento:
          type: string
          format: date
          example: 1996-06-01

        foto:
          type: string
          example: https://exemplo.com/tom-holland.jpg

        biografia:
          type: string
          example: Thomas Stanley Holland é um ator britânico conhecido por interpretar Homem-Aranha nos filmes da Marvel.

        id_sexo:
          type: integer
          example: 3

        nacionalidade:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                example: 1

    Diretor:
      type: object

      required:
        - nome
        - data_nascimento
        - foto
        - biografia
        - id_sexo

      properties:

        id:
          type: integer
          example: 1

        nome:
          type: string
          example: Christopher Nolan

        data_nascimento:
          type: string
          format: date
          example: 1970-07-30

        foto:
          type: string
          example: https://exemplo.com/christopher-nolan.jpg

        biografia:
          type: string
          example: Diretor britânico-americano conhecido por filmes como Interestelar e A Origem.

        id_sexo:
          type: integer
          example: 3

        nacionalidade:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                example: 1

  requestBodies:

    Filme:
      description: Objeto que deve ser enviado no body das requisições

      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Filme'

    Genero:
      description: Objeto que deve ser enviado no body das requisições

      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Genero'

    Sexo:
      description: Objeto que deve ser enviado no body das requisições

      content:
        application/json:
          schema:
